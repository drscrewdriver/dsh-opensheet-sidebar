# dsh-opensheet-sidebar bundle patch
#
# Assembly layer for the DSH profiles whose bundle list includes this package.
# A pure addition: one insert row with an id no shipped entry uses. No shipped
# row is disabled, renamed, or reconfigured here.
#
# ⚠️ 这一步只是「插入行」。**光有它、光把包装进 node_modules 是不够的**
#    （实测：两者都做了，插件依然不加载、且不报错）——因为 bundle 层只在
#    profile 的 `dsh.profile.bundles` 列到本包时才被合成。完整手动安装是三步：
#
#      1) 复制本包到 ~/.dsh/profiles/<profile>/node_modules/
#      2) 把 "dsh-opensheet-sidebar" 加进该 profile package.json 的
#         dsh.profile.bundles 数组        ← 漏掉这步 = 永远不加载
#      3) 把下面的 insert 行追加到该 profile 的 cordis.patch.yml
#
#    验证（无需启动）：dsh --profile <profile> --dump-config | grep dsh-opensheet-sidebar
#    —— 没有这一行就说明第 2 步没生效。
#
# 推荐方式（官方 CLI，会把依赖与 bundles 一起维护好）：
#    dsh plugin --profile <profile> add <path-to-plugin>
#
# 两种方式二选一，勿重复注册。
- insert:
    - id: dsh-opensheet-sidebar
      name: dsh-opensheet-sidebar
